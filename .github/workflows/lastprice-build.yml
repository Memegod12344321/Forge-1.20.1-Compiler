name: Last Price Forge 1.20.1 Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'LastPrice/**'
      - '.github/workflows/lastprice-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LastPrice
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.8
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.8-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.8/bin" >> "$GITHUB_PATH"
      - name: Verify project files
        run: |
          test -f build.gradle
          test -f src/main/java/com/memegod/lastprice/LastPrice.java
          test -f src/main/resources/META-INF/mods.toml
      - name: Build Forge mod
        run: gradle --no-daemon clean build
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LastPrice-Forge-1.20.1
          path: LastPrice/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
