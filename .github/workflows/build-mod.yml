name: Build Forge 1.20.1 Mod

on:
  workflow_dispatch:
    inputs:
      mod_name:
        description: "Display name for the mod"
        required: true
        type: string
        default: "My Forge Mod"
      mod_id:
        description: "Mod ID (lowercase letters, numbers, underscores)"
        required: true
        type: string
        default: "mymod"
      java_code:
        description: "Complete Java source for ExampleMod.java"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          MOD_ID: ${{ inputs.mod_id }}
        run: |
          if ! [[ "$MOD_ID" =~ ^[a-z][a-z0-9_]{1,63}$ ]]; then
            echo "Invalid mod ID. Use lowercase letters, digits, and underscores; start with a letter."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Forge 1.20.1 MDK
        run: |
          curl -fL --retry 3 "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip" -o forge-mdk.zip
          mkdir forge-mdk
          unzip -q forge-mdk.zip -d forge-mdk

      - name: Inject mod source and metadata
        working-directory: forge-mdk
        env:
          MOD_ID: ${{ inputs.mod_id }}
          MOD_NAME: ${{ inputs.mod_name }}
          JAVA_CODE: ${{ inputs.java_code }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          mod_id = os.environ["MOD_ID"]
          mod_name = os.environ["MOD_NAME"]
          source = os.environ["JAVA_CODE"]
          if "package com.example.examplemod;" not in source:
              raise SystemExit("Java source must start with: package com.example.examplemod;")
          if "class ExampleMod" not in source:
              raise SystemExit("Java source must declare class ExampleMod.")
          if '@Mod("__MOD_ID__")' not in source:
              raise SystemExit('Use @Mod("__MOD_ID__") in your class so the workflow can insert your mod ID.')
          source = source.replace('@Mod("__MOD_ID__")', '@Mod("' + mod_id + '")')
          java_path = pathlib.Path("src/main/java/com/example/examplemod/ExampleMod.java")
          java_path.parent.mkdir(parents=True, exist_ok=True)
          java_path.write_text(source, encoding="utf-8")
          props = pathlib.Path("gradle.properties")
          text = props.read_text(encoding="utf-8")
          text = re.sub(r'(?m)^mod_id=.*$', 'mod_id=' + mod_id, text)
          text = re.sub(r'(?m)^mod_name=.*$', 'mod_name=' + mod_name.replace("\n", " "), text)
          props.write_text(text, encoding="utf-8")
          print("Injected ExampleMod.java and updated gradle.properties")
          PY
          chmod +x gradlew

      - name: Build mod JAR
        working-directory: forge-mdk
        run: ./gradlew --no-daemon clean build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: compiled-forge-mod
          path: forge-mdk/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
